name: Update Intermedia results

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater
        run: pip install -r requirements.txt

      - name: Get latest standings and results
        run: python update.py

      - name: Save any changes
        run: |
          if git diff --quiet index.html; then
            echo "No new results or standings changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Intermedia standings and results"
          git push
